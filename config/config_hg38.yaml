# ── Genome ───────────────────────────────────────────────────
genome: hg38
species: human
chrom_sizes: /cluster/projects/epigenomics/BACKUP_31032025/EpigenomeLab/Aminnn/Genomes/hg38.chrom.sizes.filtered
chromosomes:
  - chr1
  - chr2
  - chr3
  - chr4
  - chr5
  - chr6
  - chr7
  - chr8
  - chr9
  - chr10
  - chr11
  - chr12
  - chr13
  - chr14
  - chr15
  - chr16
  - chr17
  - chr18
  - chr19
  - chr20
  - chr21
  - chr22
  - chrX
  - chrY

# ── Resolution ───────────────────────────────────────────────
resolution: 10000

# ── Paths ────────────────────────────────────────────────────
hicpro_dir: /cluster/projects/epigenomics/Aminnn/Hi-C/HiC_ECC_all_samples
output_dir: /cluster/projects/epigenomics/Aminnn/Hi-C/HiC_ECC_all_samples/HiC_ECC_hg38_output/enhanced_data

# ── Enhancement (DeepHiC) ────────────────────────────────────
enhancement:
  method: deephic
  deephic_path: /cluster/home/t111631uhn/DeepHiC
  checkpoint: /cluster/home/t111631uhn/DeepHiC/deephic_raw_16.pth
  chunk: 100
  stride: 100
  bound: 9999
  lrc: 100

# ── Comparison (CHESS) ───────────────────────────────────────
comparison:
  method: chess
  window: 310000
  step: 10000
  threads: 4
  sn_threshold: 0
  zsim_threshold: 0

# ── Calling ──────────────────────────────────────────────────
calling:
  tad:
    tool: hicFindTADs
    fdr_correction: true
  loops:
    tool: chromosight
    threads: 12

# ── Visualization (pyECC) ────────────────────────────────────
visualization:
  region:
    chr: 1
    start: 50000000
    end: 51000000
    gene_name: Test_Region
  percentile: 90
  merge_intervals: true
  win_sz: 310kb
  show_tads: true
  show_loops: true
  show_arcs: true
  show_insulation: true
  show_genes: true
  specificity_samples: []
  gtf_path: /cluster/projects/epigenomics/BACKUP_31032025/EpigenomeLab/Aminnn/Genomes/gencode.v49.annotation.gtf 
